[project]
name = "yt-slidesnap"
version = "1.2.0"
description = "Turn a lecture video into a PDF of its slides, at the timestamps you give it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["youtube", "lecture", "slides", "screenshots", "pdf", "yt-dlp", "ffmpeg", "mcq"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp",
    "imageio-ffmpeg",
    "numpy",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/pavnxet/yt-slidesnap"

[project.scripts]
yt-slidesnap = "slidesnap:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["slidesnap"]
